
    include mime.types;
    upstream backend {
        least_conn;
        server backend_1:3000;
        server backend_2:3000;
        server backend_3:3000;
    }

    server {
        listen 8000;
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

    }
