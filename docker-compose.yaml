version: '1.0.0'
services:
  backend_1:
    build: .
    environment:
      - APP_NAME=backend_1
    expose: 
      - "3000"

  backend_2:
    build: .
    environment:
      - APP_NAME=backend_2
    expose: 
      - "3000"

  backend_3:
    build: .
    environment:
      - APP_NAME=backend_3
    expose: 
      - "3000"
  nginx_proxy:
    image: nginx:latest
    ports: 
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3    